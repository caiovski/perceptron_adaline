<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280">
  <defs>
    <style>
      @keyframes glow {
        0%, 100% { filter: drop-shadow(0 0 6px #00d4ff) drop-shadow(0 0 12px #00d4ff40); }
        50% { filter: drop-shadow(0 0 16px #00d4ff) drop-shadow(0 0 30px #00d4ffaa); }
      }
      @keyframes pulse {
        0%, 100% { r: 8; opacity: 0.9; }
        50% { r: 11; opacity: 1; }
      }
      @keyframes signalFlow {
        0% { stroke-dashoffset: 40; opacity: 0.3; }
        50% { stroke-dashoffset: 0; opacity: 1; }
        100% { stroke-dashoffset: -40; opacity: 0.3; }
      }
      @keyframes fadeInTitle {
        0% { opacity: 0; transform: translateY(-10px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes floatParticle {
        0%, 100% { opacity: 0; transform: translateY(0); }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { opacity: 0; transform: translateY(-30px); }
      }
      .node-input { animation: pulse 2s ease-in-out infinite; }
      .node-input-d1 { animation-delay: 0s; }
      .node-input-d2 { animation-delay: 0.3s; }
      .node-input-d3 { animation-delay: 0.6s; }
      .node-input-d4 { animation-delay: 0.9s; }
      .node-hidden { animation: pulse 2.5s ease-in-out infinite; }
      .node-output { animation: pulse 1.8s ease-in-out infinite; animation-delay: 0.5s; }
      .synapse {
        stroke-dasharray: 8 4;
        animation: signalFlow 2s linear infinite;
      }
      .synapse-d1 { animation-delay: 0s; }
      .synapse-d2 { animation-delay: 0.2s; }
      .synapse-d3 { animation-delay: 0.4s; }
      .synapse-d4 { animation-delay: 0.6s; }
      .glow-group { animation: glow 3s ease-in-out infinite; }
      .title-text {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        animation: fadeInTitle 1.5s ease-out both;
      }
      .particle { animation: floatParticle 4s ease-in-out infinite; }
      .p1 { animation-delay: 0s; }
      .p2 { animation-delay: 0.8s; }
      .p3 { animation-delay: 1.6s; }
      .p4 { animation-delay: 2.4s; }
      .p5 { animation-delay: 3.2s; }
    </style>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27"/>
      <stop offset="50%" style="stop-color:#0d1333"/>
      <stop offset="100%" style="stop-color:#0a0e27"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff00"/>
      <stop offset="50%"><animate attributeName="stop-color" values="#00d4ff;#66e5ff;#00d4ff" dur="3s" repeatCount="indefinite"/></stop>
      <stop offset="100%" style="stop-color:#00d4ff00"/>
    </linearGradient>
    <radialGradient id="nodeGlow">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="280" rx="16" fill="url(#bgGrad)"/>

  <!-- Grid lines (subtle) -->
  <g opacity="0.04" stroke="#00d4ff">
    <line x1="0" y1="40" x2="900" y2="40" stroke-width="0.5"/>
    <line x1="0" y1="80" x2="900" y2="80" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="900" y2="120" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="900" y2="160" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="900" y2="200" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="900" y2="240" stroke-width="0.5"/>
    <line x1="100" y1="0" x2="100" y2="280" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="280" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="280" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="280" stroke-width="0.5"/>
    <line x1="500" y1="0" x2="500" y2="280" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="280" stroke-width="0.5"/>
    <line x1="700" y1="0" x2="700" y2="280" stroke-width="0.5"/>
    <line x1="800" y1="0" x2="800" y2="280" stroke-width="0.5"/>
  </g>

  <!-- Floating particles -->
  <circle class="particle p1" cx="120" cy="200" r="2" fill="#00d4ff" opacity="0"/>
  <circle class="particle p2" cx="340" cy="230" r="1.5" fill="#66e5ff" opacity="0"/>
  <circle class="particle p3" cx="560" cy="210" r="2" fill="#00d4ff" opacity="0"/>
  <circle class="particle p4" cx="700" cy="240" r="1.5" fill="#66e5ff" opacity="0"/>
  <circle class="particle p5" cx="800" cy="190" r="2" fill="#00d4ff" opacity="0"/>

  <!-- LEFT NETWORK: Perceptron -->
  <g class="glow-group" transform="translate(40, 70)">
    <!-- Synapses (connections) -->
    <line class="synapse synapse-d1" x1="30" y1="20" x2="120" y2="70" stroke="#00d4ff" stroke-width="1.5" opacity="0.6"/>
    <line class="synapse synapse-d2" x1="30" y1="70" x2="120" y2="70" stroke="#00d4ff" stroke-width="1.5" opacity="0.6"/>
    <line class="synapse synapse-d3" x1="30" y1="120" x2="120" y2="70" stroke="#00d4ff" stroke-width="1.5" opacity="0.6"/>
    <line class="synapse synapse-d4" x1="120" y1="70" x2="210" y2="70" stroke="#00d4ff" stroke-width="2" opacity="0.8"/>

    <!-- Input nodes -->
    <circle class="node-input node-input-d1" cx="30" cy="20" r="8" fill="#00d4ff" opacity="0.9"/>
    <circle class="node-input node-input-d2" cx="30" cy="70" r="8" fill="#00d4ff" opacity="0.9"/>
    <circle class="node-input node-input-d3" cx="30" cy="120" r="8" fill="#00d4ff" opacity="0.9"/>

    <!-- Hidden/Soma node -->
    <circle cx="120" cy="70" r="20" fill="url(#nodeGlow)" filter="url(#blur)"/>
    <circle class="node-hidden" cx="120" cy="70" r="12" fill="#00d4ff" opacity="0.9"/>
    <text x="120" y="74" text-anchor="middle" fill="#0a0e27" font-size="11" font-weight="bold" font-family="monospace">Σ</text>

    <!-- Output node -->
    <circle class="node-output" cx="210" cy="70" r="8" fill="#66e5ff" opacity="0.9"/>

    <!-- Labels -->
    <text x="14" y="23" text-anchor="end" fill="#00d4ff" font-size="10" font-family="monospace" opacity="0.9">x1</text>
    <text x="14" y="73" text-anchor="end" fill="#00d4ff" font-size="10" font-family="monospace" opacity="0.9">x2</text>
    <text x="14" y="123" text-anchor="end" fill="#00d4ff" font-size="10" font-family="monospace" opacity="0.9">x3</text>
    <text x="226" y="73" fill="#66e5ff" font-size="10" font-family="monospace" opacity="0.9">y</text>
  </g>

  <!-- RIGHT NETWORK: Adaline (Shifted right to translate(660, 55)) -->
  <g class="glow-group" transform="translate(660, 55)">
    <!-- Synapses -->
    <line class="synapse synapse-d1" x1="30" y1="15" x2="120" y2="85" stroke="#00d4ff" stroke-width="1.5" opacity="0.6"/>
    <line class="synapse synapse-d2" x1="30" y1="55" x2="120" y2="85" stroke="#00d4ff" stroke-width="1.5" opacity="0.6"/>
    <line class="synapse synapse-d3" x1="30" y1="95" x2="120" y2="85" stroke="#00d4ff" stroke-width="1.5" opacity="0.6"/>
    <line class="synapse synapse-d4" x1="30" y1="135" x2="120" y2="85" stroke="#00d4ff" stroke-width="1.5" opacity="0.6"/>
    <line class="synapse" x1="120" y1="85" x2="205" y2="85" stroke="#00d4ff" stroke-width="2" opacity="0.8" style="animation-delay: 0.8s;"/>

    <!-- Input nodes -->
    <circle class="node-input node-input-d1" cx="30" cy="15" r="8" fill="#00d4ff" opacity="0.9"/>
    <circle class="node-input node-input-d2" cx="30" cy="55" r="8" fill="#00d4ff" opacity="0.9"/>
    <circle class="node-input node-input-d3" cx="30" cy="95" r="8" fill="#00d4ff" opacity="0.9"/>
    <circle class="node-input node-input-d4" cx="30" cy="135" r="8" fill="#00d4ff" opacity="0.9"/>

    <!-- Soma node -->
    <circle cx="120" cy="85" r="20" fill="url(#nodeGlow)" filter="url(#blur)"/>
    <circle class="node-hidden" cx="120" cy="85" r="12" fill="#00d4ff" opacity="0.9"/>
    <text x="120" y="89" text-anchor="middle" fill="#0a0e27" font-size="11" font-weight="bold" font-family="monospace">Σ</text>

    <!-- Output node -->
    <circle class="node-output" cx="205" cy="85" r="8" fill="#66e5ff" opacity="0.9"/>

    <!-- Error feedback line -->
    <path d="M 205 95 Q 205 130 162 130 Q 120 130 120 105" stroke="#ff6b9d" stroke-width="1" stroke-dasharray="4 3" fill="none" opacity="0.5">
      <animate attributeName="stroke-dashoffset" values="0;-14" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <text x="162" y="145" text-anchor="middle" fill="#ff6b9d" font-size="8" font-family="monospace" opacity="0.6">erro</text>

    <!-- Labels -->
    <text x="14" y="18" text-anchor="end" fill="#00d4ff" font-size="10" font-family="monospace" opacity="0.9">x1</text>
    <text x="14" y="58" text-anchor="end" fill="#00d4ff" font-size="10" font-family="monospace" opacity="0.9">x2</text>
    <text x="14" y="98" text-anchor="end" fill="#00d4ff" font-size="10" font-family="monospace" opacity="0.9">x3</text>
    <text x="14" y="138" text-anchor="end" fill="#00d4ff" font-size="10" font-family="monospace" opacity="0.9">x4</text>
    <text x="218" y="88" fill="#66e5ff" font-size="10" font-family="monospace" opacity="0.9">y</text>
  </g>

  <!-- Center Title -->
  <g class="title-text">
    <!-- Professional Neural Vector Icon -->
    <g transform="translate(450, 36)">
      <circle cx="0" cy="0" r="4.5" fill="#00d4ff"/>
      <circle cx="-16" cy="-9" r="3" fill="#66e5ff"/>
      <circle cx="16" cy="-9" r="3" fill="#66e5ff"/>
      <circle cx="-12" cy="11" r="3" fill="#66e5ff"/>
      <circle cx="12" cy="11" r="3" fill="#66e5ff"/>
      <line x1="-16" y1="-9" x2="0" y2="0" stroke="#00d4ff" stroke-width="1.2" opacity="0.8"/>
      <line x1="16" y1="-9" x2="0" y2="0" stroke="#00d4ff" stroke-width="1.2" opacity="0.8"/>
      <line x1="-12" y1="11" x2="0" y2="0" stroke="#00d4ff" stroke-width="1.2" opacity="0.8"/>
      <line x1="12" y1="11" x2="0" y2="0" stroke="#00d4ff" stroke-width="1.2" opacity="0.8"/>
    </g>

    <text x="450" y="74" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="bold" font-family="'Segoe UI', sans-serif" letter-spacing="3">
      REDES NEURAIS
    </text>
    <text x="450" y="104" text-anchor="middle" fill="#00d4ff" font-size="19" font-weight="600" font-family="'Segoe UI', sans-serif" letter-spacing="4">
      PERCEPTRON &amp; ADALINE
    </text>
    <text x="450" y="134" text-anchor="middle" fill="#8892b0" font-size="12" font-family="'Segoe UI', sans-serif">
      Classificação de Padrões com Redes de Camada Única
    </text>
  </g>

  <!-- Bottom decorative line -->
  <rect x="200" y="158" width="500" height="1" fill="url(#lineGrad)" rx="1"/>

  <!-- Bottom info -->
  <text x="450" y="188" text-anchor="middle" fill="#5a6a8a" font-size="11" font-family="'Segoe UI', sans-serif">
    CEFET-MG Campus VIII – Varginha  •  Lab. Inteligência Artificial
  </text>
  <text x="450" y="208" text-anchor="middle" fill="#4a5a7a" font-size="10" font-family="'Segoe UI', sans-serif">
    Prof. Lázaro Eduardo da Silva
  </text>

  <!-- Border glow -->
  <rect x="1" y="1" width="898" height="278" rx="16" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.15"/>
</svg>
