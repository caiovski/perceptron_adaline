<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120">
  <defs>
    <style>
      @keyframes waveMove {
        0% { transform: translateX(0); }
        100% { transform: translateX(-200px); }
      }
      @keyframes glowPulse {
        0%, 100% { filter: drop-shadow(0 0 4px #00d4ff40); }
        50% { filter: drop-shadow(0 0 10px #00d4ff80); }
      }
      .wave { animation: waveMove 8s linear infinite; }
      .footer-glow { animation: glowPulse 3s ease-in-out infinite; }
      @keyframes blink {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      .blink-dot { animation: blink 2s ease-in-out infinite; }
      .bd1 { animation-delay: 0s; }
      .bd2 { animation-delay: 0.5s; }
      .bd3 { animation-delay: 1s; }
    </style>
    <linearGradient id="footBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e2700"/>
      <stop offset="40%" style="stop-color:#0a0e27"/>
      <stop offset="100%" style="stop-color:#0d1333"/>
    </linearGradient>
    <linearGradient id="topLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="120" rx="0 0 16 16" fill="url(#footBg)"/>

  <!-- Top border line -->
  <rect x="0" y="0" width="900" height="1" fill="url(#topLine)"/>

  <!-- Wave pattern -->
  <g class="wave" opacity="0.06">
    <path d="M0,60 Q50,30 100,60 Q150,90 200,60 Q250,30 300,60 Q350,90 400,60 Q450,30 500,60 Q550,90 600,60 Q650,30 700,60 Q750,90 800,60 Q850,30 900,60 Q950,90 1000,60 Q1050,30 1100,60" stroke="#00d4ff" fill="none" stroke-width="2"/>
  </g>

  <!-- Blinking dots -->
  <circle class="blink-dot bd1" cx="350" cy="35" r="2" fill="#00d4ff"/>
  <circle class="blink-dot bd2" cx="450" cy="35" r="2" fill="#00d4ff"/>
  <circle class="blink-dot bd3" cx="550" cy="35" r="2" fill="#00d4ff"/>

  <!-- Text & Professional Vector Icon -->
  <g class="footer-glow">
    <!-- Sleek neural vector icon in place of emoji -->
    <g transform="translate(450, 32)">
      <circle cx="0" cy="0" r="3" fill="#00d4ff"/>
      <circle cx="-10" cy="-6" r="2" fill="#66e5ff"/>
      <circle cx="10" cy="-6" r="2" fill="#66e5ff"/>
      <circle cx="-8" cy="7" r="2" fill="#66e5ff"/>
      <circle cx="8" cy="7" r="2" fill="#66e5ff"/>
      <line x1="-10" y1="-6" x2="0" y2="0" stroke="#00d4ff" stroke-width="0.9" opacity="0.7"/>
      <line x1="10" y1="-6" x2="0" y2="0" stroke="#00d4ff" stroke-width="0.9" opacity="0.7"/>
      <line x1="-8" y1="7" x2="0" y2="0" stroke="#00d4ff" stroke-width="0.9" opacity="0.7"/>
      <line x1="8" y1="7" x2="0" y2="0" stroke="#00d4ff" stroke-width="0.9" opacity="0.7"/>
    </g>

    <text x="450" y="65" text-anchor="middle" fill="#5a6a8a" font-size="11" font-family="'Segoe UI', sans-serif">
      Desenvolvido para a disciplina de Laboratório de Inteligência Artificial
    </text>
    <text x="450" y="85" text-anchor="middle" fill="#3a4a6a" font-size="10" font-family="'Segoe UI', sans-serif">
      CEFET-MG Campus VIII – Varginha  •  2026
    </text>
    <text x="450" y="105" text-anchor="middle" fill="#00d4ff" font-size="10" font-family="monospace" opacity="0.4">
      ⟨ perceptron | adaline ⟩
    </text>
  </g>
</svg>
